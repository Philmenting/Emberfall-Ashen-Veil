name: Google Play Beta Release Candidate
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  play-beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Verify declared publication gates
      run: python3 scripts/check_play_release.py --strict
    - name: Require a permanent Play upload key
      env:
        UPLOAD_KEY: ${{ secrets.EMBERFALL_UPLOAD_KEYSTORE_B64 }}
        UPLOAD_ALIAS: ${{ secrets.EMBERFALL_UPLOAD_ALIAS }}
        UPLOAD_PASSWORD: ${{ secrets.EMBERFALL_UPLOAD_PASSWORD }}
      run: |-
        python3 - <<'PYKEY'
        import os
        missing = [name for name in ('UPLOAD_KEY','UPLOAD_ALIAS','UPLOAD_PASSWORD') if not os.environ.get(name)]
        if missing: raise SystemExit('Configure the permanent Play upload-key secrets in repository settings before running this workflow.')
        PYKEY
    - name: Install Java 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Install Android export packages
      run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1' 'platforms;android-36' 'build-tools;36.1.0'
    - name: Download Godot 4.7.2 and Android templates
      run: |
        mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
        curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot/godot.zip" \
          https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
        sudo install -m 0755 "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
        curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot/templates.tpz" \
          https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
        unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
        cp "$RUNNER_TEMP/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
    - name: Configure Godot Android paths and debug key
      run: |
        mkdir -p "$HOME/.config/godot" "$HOME/.android"
        keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
          -dname 'CN=Android Debug,O=Android,C=US'
        cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
        [gd_resource type="EditorSettings" format=3]

        [resource]

        export/android/java_sdk_path = "$JAVA_HOME"
        export/android/android_sdk_path = "$ANDROID_HOME"
        EOF
    - name: Run beta regression and packaging checks
      run: |-
        godot --headless --path . --editor --import --quit
        python3 scripts/run_beta_checks.py
        python3 -m unittest discover -s tests -p test_android_release.py -v
    - name: Restore the private upload key
      env:
        UPLOAD_KEY: ${{ secrets.EMBERFALL_UPLOAD_KEYSTORE_B64 }}
        UPLOAD_ALIAS: ${{ secrets.EMBERFALL_UPLOAD_ALIAS }}
        UPLOAD_PASSWORD: ${{ secrets.EMBERFALL_UPLOAD_PASSWORD }}
      run: |-
        python3 - <<'PYKEY'
        import base64, os, pathlib, uuid
        path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'emberfall-play-upload.jks'
        path.write_bytes(base64.b64decode(os.environ['UPLOAD_KEY'], validate=True))
        path.chmod(0o600)
        password_file = path.with_suffix('.password')
        if chr(10) in os.environ['UPLOAD_PASSWORD'] or chr(13) in os.environ['UPLOAD_PASSWORD']: raise SystemExit('Upload-key password must not contain a line break')
        password_file.write_text(os.environ['UPLOAD_PASSWORD'])
        password_file.chmod(0o600)
        values = {'GODOT_ANDROID_KEYSTORE_RELEASE_PATH':str(path), 'GODOT_ANDROID_KEYSTORE_RELEASE_USER':os.environ['UPLOAD_ALIAS'], 'GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD':os.environ['UPLOAD_PASSWORD']}
        with open(os.environ['GITHUB_ENV'],'a') as output:
            for key,value in values.items():
                delimiter = uuid.uuid4().hex
                output.write(chr(10).join((f"{key}<<{delimiter}", value, delimiter, "")))
        PYKEY
    - name: Build and verify upload-signed beta artifacts
      run: |-
        mkdir -p build
        beta_version_code="$(python3 -c 'import json; print(json.load(open("docs/play/store.json"))["version_code"])')"
        beta_version_name="$(python3 -c 'import json; print(json.load(open("docs/play/store.json"))["version_name"])')"
        python3 scripts/prepare_android_beta_build.py --template "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip" --central-mirror https://maven-central.storage-download.googleapis.com/maven2/
        godot --headless --path . --export-release 'Android Closed Beta APK' build/emberfall-closed-beta.apk
        godot --headless --path . --export-release 'Google Play Beta' build/emberfall-play-beta.aab
        curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
        python3 scripts/verify_android_aab.py --bundle build/emberfall-play-beta.aab --bundletool "$RUNNER_TEMP/bundletool.jar" --package com.philmenting.emberfallashenveil --version-code "$beta_version_code" --version-name "$beta_version_name" --min-sdk 24 --target-sdk 36
        "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose build/emberfall-closed-beta.apk
        "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 4 build/emberfall-closed-beta.apk
        java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=build/emberfall-play-beta.aab --output=build/emberfall-play-beta.apks --mode=universal --ks="$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" --ks-key-alias="$GODOT_ANDROID_KEYSTORE_RELEASE_USER" --ks-pass="file:$RUNNER_TEMP/emberfall-play-upload.password" --key-pass="file:$RUNNER_TEMP/emberfall-play-upload.password"
        unzip -p build/emberfall-play-beta.apks universal.apk > build/emberfall-play-derived.apk
        "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 4 build/emberfall-play-derived.apk
        sha256sum build/emberfall-play-beta.aab build/emberfall-closed-beta.apk build/emberfall-play-derived.apk > build/SHA256SUMS.txt
    - name: Upload verified beta artifacts (no Play publication)
      uses: actions/upload-artifact@v7
      with:
        name: emberfall-upload-signed-play-beta
        path: |-
          build/emberfall-play-beta.aab
          build/emberfall-closed-beta.apk
          build/emberfall-play-derived.apk
          build/SHA256SUMS.txt
        if-no-files-found: error
        retention-days: 14
    - name: Delete temporary upload key
      if: always()
      run: rm -f "$RUNNER_TEMP/emberfall-play-upload.jks" "$RUNNER_TEMP/emberfall-play-upload.password"
