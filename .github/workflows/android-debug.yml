name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android export packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1' 'platforms;android-36' 'build-tools;36.1.0'

      - name: Download Godot 4.7.2 and Android templates
        run: |
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 0755 "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot/templates.tpz" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp "$RUNNER_TEMP/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths and debug key
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Check automatic 3D dungeon and background lifecycle
        run: |
          godot --headless --path . --editor --import --quit
          XDG_DATA_HOME="$RUNNER_TEMP/emberfall-smoke-data" timeout 120s godot --headless --path . --fixed-fps 60 --script tests/dungeon_smoke.gd
          XDG_DATA_HOME="$RUNNER_TEMP/emberfall-persistence-data" timeout 120s godot --headless --path . --fixed-fps 60 --script tests/persistence_smoke.gd

      - name: Check regional scenery and world separation
        run: XDG_DATA_HOME="$RUNNER_TEMP/emberfall-regions-data" timeout 120s godot --headless --path . --fixed-fps 60 --script tests/regions_smoke.gd

      - name: Check gear forecasts and first-run flow
        run: |
          XDG_DATA_HOME="$RUNNER_TEMP/emberfall-gear-data" timeout 120s godot --headless --path . --fixed-fps 60 --script tests/gear_forecast_smoke.gd
          XDG_DATA_HOME="$RUNNER_TEMP/emberfall-onboarding-data" timeout 120s godot --headless --path . --fixed-fps 60 --script tests/onboarding_smoke.gd

      - name: Check audio, options and safe Back navigation
        run: XDG_DATA_HOME="$RUNNER_TEMP/emberfall-options-data" timeout 120s godot --headless --path . --fixed-fps 60 --script tests/options_smoke.gd

      - name: Check Mana Ward and old expedition compatibility
        run: XDG_DATA_HOME="$RUNNER_TEMP/emberfall-ward-data" timeout 120s godot --headless --path . --fixed-fps 60 --script tests/mana_ward_smoke.gd

      - name: Export Android test APK and Play-format AAB
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --editor --import --quit
          godot --headless --path . --install-android-build-template --export-debug 'Android Debug' 'build/emberfall-debug.apk'
          python3 scripts/prepare_android_beta_build.py --central-mirror https://maven-central.storage-download.googleapis.com/maven2/
          godot --headless --path . --export-debug 'Google Play Beta' 'build/emberfall-beta-debug.aab'

      - name: Upload available Android artifacts
        if: ${{ !cancelled() && hashFiles('build/emberfall-debug.apk') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: emberfall-ashen-veil-android-beta-test
          path: |
            build/emberfall-debug.apk
            build/emberfall-beta-debug.aab
          if-no-files-found: error
          retention-days: 14
