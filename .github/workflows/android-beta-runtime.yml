name: Android Beta Runtime
'on':
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      graphics_only:
        description: Run only graphics QA when AFK code is unchanged
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Install Java 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Install Android export packages
      run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1' 'platforms;android-36' 'build-tools;36.1.0'
    - name: Download Godot 4.7.2 and Android templates
      run: |
        mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
        curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot/godot.zip" \
          https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
        sudo install -m 0755 "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
        curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot/templates.tpz" \
          https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
        unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
        cp "$RUNNER_TEMP/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
    - name: Configure Godot Android paths and debug key
      run: |
        mkdir -p "$HOME/.config/godot" "$HOME/.android"
        keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
          -dname 'CN=Android Debug,O=Android,C=US'
        cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
        [gd_resource type="EditorSettings" format=3]

        [resource]

        export/android/java_sdk_path = "$JAVA_HOME"
        export/android/android_sdk_path = "$ANDROID_HOME"
        EOF
    - name: Check isolated QA export contracts
      run: python3 -m unittest discover -s tests -p test_android_release.py -v
    - name: Import once and build isolated offline QA packages
      env:
        GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
        GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
        GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
      run: |
        mkdir -p build
        packages=()
        if [ "${{ inputs.graphics_only }}" != "true" ]; then
          packages+=(--package res://tests/android_beta_flow.tscn build/emberfall-afk-qa.apk x86_64)
        fi
        packages+=(--package res://tests/android_success_flow.tscn build/emberfall-success-qa.apk x86_64)
        packages+=(--package res://tests/android_art_flow.tscn build/emberfall-art-qa.apk x86_64)
        packages+=(--package res://tests/android_device_probe.tscn build/emberfall-pixel-probe.apk arm64-v8a)
        python3 scripts/export_android_qa.py "${packages[@]}" 2>&1 | tee build/android-qa-export.log
    - name: Enable emulator hardware acceleration
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Verify AFK recovery and restart on Android 16
      uses: ReactiveCircus/android-emulator-runner@v2
      env:
        EMBERFALL_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot -camera-back none
        script: |
          # The software renderer reached about 90% of the exact one-hour AFK
          # ledger at the previous 300-second deadline. Keep all assertions and
          # cold-restart coverage; allow this CI-only replay more wall time.
          if [ "${{ inputs.graphics_only }}" != "true" ]; then python3 scripts/android_beta_smoke.py --timeout-seconds 900 --apk build/emberfall-afk-qa.apk; fi
          adb shell wm size 1080x2424
          python3 scripts/android_beta_smoke.py --success-only --apk build/emberfall-success-qa.apk --output build/android-success-runtime
          python3 scripts/android_beta_smoke.py --art-only --apk build/emberfall-art-qa.apk --output build/android-art-runtime
    - name: Upload QA evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: emberfall-android-beta-runtime-evidence
        path: |-
          build/android-qa-export.log
          build/android-beta-runtime
          build/android-art-runtime
          build/android-success-runtime
        if-no-files-found: warn
        retention-days: 14
    - name: Upload isolated QA packages
      uses: actions/upload-artifact@v7
      with:
        name: emberfall-isolated-android-qa-packages
        path: |
          build/emberfall-afk-qa.apk
          build/emberfall-art-qa.apk
          build/emberfall-success-qa.apk
          build/emberfall-pixel-probe.apk
        retention-days: 14
